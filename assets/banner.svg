<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="40%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#180b2c"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animated Shimmer Effect -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ec4899" stop-opacity="1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.8"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -80; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0.1; }
      50% { opacity: 0.35; }
      100% { transform: translateY(450px); opacity: 0.1; }
    }
    .orb-1 { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 12s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .flow-line { stroke-dasharray: 8, 8; animation: dashMove 4s linear infinite; }
    .floating-card { animation: floatWave 6s ease-in-out infinite; }
    .film-strip { opacity: 0.18; }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated Ambient Orbs in Background -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="#7928ca" filter="url(#glow-purple)"/>
  <circle class="orb-2" cx="1020" cy="330" r="160" fill="#0070f3" filter="url(#glow-cyan)"/>
  <circle cx="600" cy="420" r="130" fill="#ec4899" opacity="0.2" filter="url(#glow-purple)"/>

  <!-- Modern Perspective Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Animated Connection / Generation Rays in Background -->
  <path class="flow-line" d="M 50 380 Q 300 280 600 370 T 1150 290" fill="none" stroke="url(#cyan-violet)" stroke-width="1.8" opacity="0.45"/>
  <path class="flow-line" d="M 80 80 Q 400 160 700 70 T 1120 140" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" opacity="0.35" style="animation-duration: 6s;"/>

  <!-- Subtle Filmstrip / Timeline Animation Decorator (Edge) -->
  <g class="film-strip" transform="translate(60, 25)">
    <rect x="0" y="0" width="1080" height="20" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- Sprocket holes -->
    <rect x="20" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="70" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="120" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="170" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="220" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="270" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="800" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="850" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="900" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="950" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="1000" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="1050" y="4" width="16" height="12" rx="2" fill="#ffffff" fill-opacity="0.25"/>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Clear & Legible Hierarchy -->

  <!-- Top Category Tag / Badge -->
  <g transform="translate(600, 78)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="-150" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="2" text-anchor="middle">
      🎬 CURATED REPOSITORY &amp; DIRECTORY
    </text>
  </g>

  <!-- Main Title: Shimmering Gradient Headline -->
  <g transform="translate(600, 160)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="url(#shimmer)" letter-spacing="-0.5" text-anchor="middle">
      Awesome AI Animation &amp; Video Generation
    </text>
  </g>

  <!-- Subtitle: High Contrast Foreground -->
  <g transform="translate(600, 208)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" text-anchor="middle">
      Diffusion Models • Multi-Shot Video Directing • Motion Transfer • ComfyUI Pipelines
    </text>
  </g>

  <!-- Feature Pill Tags in Clear Floating Cards -->
  <g transform="translate(100, 260)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="48" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="24" y="28" font-size="18">⚡</text>
      <text x="52" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f8fafc">Text-to-Video</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(205, 0)">
      <rect width="180" height="48" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="22" y="28" font-size="18">🎭</text>
      <text x="50" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f8fafc">Motion Transfer</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(410, 0)">
      <rect width="180" height="48" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="22" y="28" font-size="18">🎥</text>
      <text x="50" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f8fafc">Video Directing</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(615, 0)">
      <rect width="180" height="48" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="22" y="28" font-size="18">🧩</text>
      <text x="50" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f8fafc">ComfyUI Nodes</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(820, 0)">
      <rect width="180" height="48" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="22" y="28" font-size="18">🚀</text>
      <text x="50" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f8fafc">Open Foundation</text>
    </g>
  </g>

  <!-- Bottom Ecosystem Stats Indicator Line -->
  <g transform="translate(600, 360)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="1.2" text-anchor="middle">
      TOP SAAS BENCHMARKS <tspan fill="#38bdf8">•</tspan> 25+ OPEN-SOURCE MODELS <tspan fill="#ec4899">•</tspan> LOCAL WORKFLOWS
    </text>
  </g>

  <!-- Accent Edge Highlight Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-grad)"/>
</svg>
